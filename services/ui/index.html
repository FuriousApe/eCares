<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Care Gap Worklist</title>
<style>
  :root { color-scheme: light; --border:#d8dde3; --bg:#f6f7f9; --accent:#2b6cb0; --danger:#b03030; --muted:#667085; }
  * { box-sizing: border-box; }
  body { margin:0; font: 14px/1.4 system-ui, sans-serif; background:var(--bg); color:#1a1d21; }
  header { background:#fff; border-bottom:1px solid var(--border); padding:10px 16px; }
  h1 { font-size:16px; margin:0 0 8px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:6px; }
  label { font-size:12px; color:var(--muted); margin-right:4px; }
  input, select, button { font:inherit; padding:4px 6px; border:1px solid var(--border); border-radius:4px; background:#fff; }
  button { cursor:pointer; background:#fff; }
  button:hover { background:#f0f2f5; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  #errorBanner { background:#fdecec; border:1px solid var(--danger); color:var(--danger); padding:6px 10px; border-radius:4px; margin:8px 16px 0; display:flex; gap:8px; align-items:center; }
  #errorBanner code { background:#fff; padding:1px 5px; border-radius:3px; font-size:11px; }
  #errorBanner button { margin-left:auto; }
  #meta { font-size:12px; color:var(--muted); }
  nav.tabs { display:flex; gap:4px; padding:8px 16px 0; }
  nav.tabs button { border-bottom:none; border-radius:4px 4px 0 0; }
  nav.tabs button.active { background:var(--bg); font-weight:600; border-bottom:1px solid var(--bg); position:relative; top:1px; }
  main { padding:16px; }
  section.view { display:none; background:#fff; border:1px solid var(--border); border-radius:4px; padding:12px; }
  section.view.active { display:block; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border-bottom:1px solid var(--border); padding:5px 6px; text-align:left; white-space:nowrap; }
  th { color:var(--muted); font-weight:600; }
  tbody tr:hover { background:#fafbfc; }
  .badge { padding:1px 6px; border-radius:10px; font-size:11px; background:#eef0f2; }
  .badge[data-status="open"] { background:#e6f0ff; color:#1355a8; }
  .badge[data-status="in_progress"] { background:#fff3cd; color:#8a6300; }
  .badge[data-status="completed"] { background:#e2f5e6; color:#1c7a34; }
  .badge[data-status="declined"], .badge[data-status="closed"] { background:#f0f0f0; color:#555; }
  .overdue { color:var(--danger); font-weight:600; }
  .actions button { padding:2px 6px; font-size:12px; margin-right:2px; }
  #patientDetail { margin-top:12px; border-top:1px dashed var(--border); padding-top:10px; }
  #patientDetail:empty { display:none; }
  table.generic td, table.generic th { white-space:normal; }
  .hint { color:var(--muted); font-size:11px; }
</style>
</head>
<body>

<header>
  <h1>Care Gap Worklist</h1>
  <div class="row">
    <label>Role
      <select id="role">
        <option value="scheduler">scheduler</option>
        <option value="clinical">clinical</option>
        <option value="admin">admin</option>
      </select>
    </label>
    <label>User id <input id="userId" placeholder="user id" size="10"></label>
    <label>API base <input id="apiBase" size="26"></label>
    <span id="meta">loading meta…</span>
  </div>
</header>

<div id="errorBanner" hidden></div>

<nav class="tabs">
  <button data-tab="worklist" class="active">Worklist</button>
  <button data-tab="patients">Patients</button>
  <button data-tab="admin" id="adminTabBtn" hidden>Admin</button>
</nav>

<main>

  <section id="view-worklist" class="view active">
    <div class="row">
      <label>Specialty <input id="wl-specialty" placeholder="e.g. Cardiology"></label>
      <label>Task type
        <select id="wl-task_type"><option value="">any</option><option value="scheduling">scheduling</option><option value="referral">referral</option></select>
      </label>
      <label>Status
        <select id="wl-status">
          <option value="">default (open + in progress)</option>
          <option value="open">open</option>
          <option value="in_progress">in_progress</option>
          <option value="completed">completed</option>
          <option value="declined">declined</option>
          <option value="closed">closed</option>
        </select>
      </label>
      <label>Program <input id="wl-program" placeholder="e.g. diabetes_management"></label>
      <label>Tier <input id="wl-tier" placeholder="e.g. high_risk"></label>
      <label><input type="checkbox" id="wl-overdue"> overdue only</label>
    </div>
    <table>
      <thead><tr>
        <th>Task</th><th>Patient</th><th>Program</th><th>Tier</th><th>Specialty</th><th>Type</th>
        <th>Status</th><th>Due</th><th>Overdue (d)</th><th>Snoozed until</th><th>Actions</th>
      </tr></thead>
      <tbody id="wl-body"></tbody>
    </table>
    <p><button id="wl-more" hidden>Load more</button></p>
  </section>

  <section id="view-patients" class="view">
    <div class="row">
      <label>Search <input id="pt-q" placeholder="name or id"></label>
      <label>Specialty <input id="pt-specialty" placeholder="e.g. Cardiology"></label>
      <label>Task type
        <select id="pt-task_type"><option value="">any</option><option value="scheduling">scheduling</option><option value="referral">referral</option></select>
      </label>
      <label>Status
        <select id="pt-status">
          <option value="">default</option>
          <option value="open">open</option>
          <option value="in_progress">in_progress</option>
          <option value="completed">completed</option>
          <option value="declined">declined</option>
          <option value="closed">closed</option>
        </select>
      </label>
    </div>
    <table>
      <thead><tr><th>Patient</th><th>Name</th><th>Enrollments</th><th>Visible tasks</th></tr></thead>
      <tbody id="pt-body"></tbody>
    </table>
    <p><button id="pt-more" hidden>Load more</button></p>
    <div id="patientDetail"></div>
  </section>

  <section id="view-admin" class="view">
    <div class="row">
      <button id="admin-sync" class="primary">Run sync</button>
      <button id="admin-evaluate" class="primary">Evaluate all patients</button>
      <button id="admin-refresh-runs">Refresh sync runs</button>
    </div>
    <div id="admin-result" class="hint"></div>
    <h3>Sync runs</h3>
    <div id="admin-runs"></div>
  </section>

</main>

<script src="config.js"></script>
<script>
(function(){
  "use strict";

  // ---------- persisted UI state (role/user/api base) ----------
  function lsGet(k, fallback){ try { const v = localStorage.getItem(k); return v === null ? fallback : v; } catch(_) { return fallback; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(_) { /* localStorage unavailable, ignore */ } }

  const roleEl = document.getElementById('role');
  const userIdEl = document.getElementById('userId');
  const apiBaseEl = document.getElementById('apiBase');

  roleEl.value = lsGet('ui.role', 'scheduler');
  userIdEl.value = lsGet('ui.userId', 'demo-user');
  apiBaseEl.value = lsGet('ui.apiBase', window.WORKLIST_API_BASE_URL || 'http://localhost:8000');

  function currentRole(){ return roleEl.value; }
  function currentUserId(){ return userIdEl.value || 'demo-user'; }
  function currentApiBase(){ return (apiBaseEl.value || '').replace(/\/+$/, ''); }

  roleEl.addEventListener('change', () => { lsSet('ui.role', roleEl.value); onRoleOrUserChanged(); });
  userIdEl.addEventListener('change', () => { lsSet('ui.userId', userIdEl.value); });
  apiBaseEl.addEventListener('change', () => { lsSet('ui.apiBase', apiBaseEl.value); refreshAll(); });

  // ---------- generic helpers ----------
  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function qs(obj){
    const parts = [];
    for (const k in obj) {
      const v = obj[k];
      if (v === undefined || v === null || v === '') continue;
      parts.push(encodeURIComponent(k) + '=' + encodeURIComponent(v));
    }
    return parts.length ? '?' + parts.join('&') : '';
  }

  async function api(path, opts){
    opts = opts || {};
    const base = currentApiBase();
    let res;
    try {
      res = await fetch(base + path, {
        method: opts.method || 'GET',
        headers: { 'Content-Type': 'application/json', 'X-User-Role': currentRole(), 'X-User-Id': currentUserId() },
        body: opts.body ? JSON.stringify(opts.body) : undefined
      });
    } catch (networkErr) {
      const e = new Error('Could not reach API at ' + base + ' (' + networkErr.message + ')');
      throw e;
    }
    const requestId = res.headers.get('X-Request-Id');
    let data = null;
    try { data = await res.json(); } catch (_) { /* empty/non-JSON body */ }
    if (!res.ok) {
      const err = new Error((data && data.message) || res.statusText || ('HTTP ' + res.status));
      err.status = res.status;
      err.code = data && data.code;
      err.requestId = (data && data.request_id) || requestId;
      throw err;
    }
    return data;
  }

  function showError(err){
    const el = document.getElementById('errorBanner');
    const rid = err.requestId ? `<code>${escapeHtml(err.requestId)}</code>` : '';
    el.innerHTML = `<span>${escapeHtml(err.message || 'Request failed')}</span> ${rid} <button id="errClose">dismiss</button>`;
    el.hidden = false;
    document.getElementById('errClose').onclick = () => { el.hidden = true; };
  }

  // ---------- tabs ----------
  document.querySelectorAll('nav.tabs button[data-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav.tabs button[data-tab]').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('section.view').forEach(s => s.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-' + btn.dataset.tab).classList.add('active');
    });
  });

  function onRoleOrUserChanged(){
    const isAdmin = currentRole() === 'admin';
    document.getElementById('adminTabBtn').hidden = !isAdmin;
    if (!isAdmin && document.getElementById('view-admin').classList.contains('active')) {
      document.querySelector('nav.tabs button[data-tab="worklist"]').click();
    }
    refreshAll();
  }

  // ---------- meta banner ----------
  async function loadMeta(){
    const el = document.getElementById('meta');
    try {
      const m = await api('/meta');
      const asOf = m.as_of_date || m.asOfDate || m.as_of || '?';
      const lastSync = m.last_sync_at || m.last_sync_time || m.lastSyncAt || '?';
      const counts = m.task_counts || m.taskCounts;
      const countsStr = counts ? Object.entries(counts).map(([k, v]) => `${k}:${v}`).join(' ') : (m.total_tasks != null ? 'tasks:' + m.total_tasks : '');
      el.textContent = `as-of ${asOf} · last sync ${lastSync} ${countsStr ? '· ' + countsStr : ''}`;
    } catch (err) {
      el.textContent = 'meta unavailable';
      showError(err);
    }
  }

  // ---------- task row rendering (shared by worklist + patient detail) ----------
  function taskRowHtml(t){
    const patient = t.patient || {};
    const name = [patient.first_name, patient.last_name].filter(Boolean).join(' ') || patient.patient_id || '';
    const overdueClass = t.days_overdue > 0 ? 'overdue' : '';
    return `
      <td>${escapeHtml(t.task_id)}</td>
      <td>${escapeHtml(name)}</td>
      <td>${escapeHtml(t.program_id)}</td>
      <td>${escapeHtml(t.tier)}</td>
      <td>${escapeHtml(t.specialty)}</td>
      <td>${escapeHtml(t.task_type)}</td>
      <td><span class="badge" data-status="${escapeHtml(t.status)}">${escapeHtml(t.status)}</span></td>
      <td>${escapeHtml(t.due_date)}</td>
      <td class="${overdueClass}">${t.days_overdue != null ? escapeHtml(t.days_overdue) : ''}</td>
      <td>${escapeHtml(t.snooze_until)}</td>
      <td class="actions">
        <button data-act="claim">Claim</button>
        <button data-act="complete">Complete</button>
        <button data-act="decline">Decline</button>
        <button data-act="snooze">Snooze</button>
      </td>`;
  }

  function makeTaskRow(t){
    const tr = document.createElement('tr');
    tr.dataset.taskId = t.task_id;
    tr.dataset.version = t.version;
    tr.innerHTML = taskRowHtml(t);
    tr.querySelectorAll('button[data-act]').forEach(btn => {
      btn.addEventListener('click', () => handleTaskAction(tr, btn.dataset.act));
    });
    return tr;
  }

  function applyTaskUpdate(task){
    // A POST action response, or a re-fetched task, may come back as {task: {...}}
    // or the flat shape itself (the plan doesn't pin this down) — accept either.
    const t = (task && task.task) ? task.task : task;
    if (!t || t.task_id == null) return;
    document.querySelectorAll(`tr[data-task-id="${t.task_id}"]`).forEach(tr => {
      tr.dataset.version = t.version;
      tr.innerHTML = taskRowHtml(t);
      tr.querySelectorAll('button[data-act]').forEach(btn => {
        btn.addEventListener('click', () => handleTaskAction(tr, btn.dataset.act));
      });
    });
  }

  async function handleTaskAction(tr, action){
    const taskId = tr.dataset.taskId;
    const body = { version: Number(tr.dataset.version) };
    if (action === 'complete') {
      const resolution = prompt('Resolution: booked / referral_approved / referral_not_indicated');
      if (!resolution) return;
      if (!['booked', 'referral_approved', 'referral_not_indicated'].includes(resolution)) { alert('Not a valid resolution.'); return; }
      body.resolution = resolution;
      const note = prompt('Note (optional):');
      if (note) body.note = note;
    } else if (action === 'decline') {
      const reason = prompt('Reason for decline:');
      if (!reason) return;
      body.reason = reason;
      const snoozeDays = prompt('Snooze days:', '90');
      body.snooze_days = snoozeDays ? Number(snoozeDays) : 90;
    } else if (action === 'snooze') {
      const until = prompt('Snooze until (YYYY-MM-DD):');
      if (!until) return;
      body.until = until;
      const reason = prompt('Reason (optional):');
      if (reason) body.reason = reason;
    }
    try {
      const updated = await api(`/tasks/${taskId}/${action}`, { method: 'POST', body });
      applyTaskUpdate(updated);
    } catch (err) {
      if (err.status === 409) {
        try {
          const fresh = await api(`/tasks/${taskId}`);
          applyTaskUpdate(fresh);
        } catch (_) { /* row stays stale, error banner still shown below */ }
        showError({ message: 'This task changed since it was loaded. The row was refreshed — please retry.', requestId: err.requestId });
      } else {
        showError(err);
      }
    }
  }

  // ---------- worklist ----------
  let wlCursor = null;
  function wlFilters(){
    return {
      specialty: document.getElementById('wl-specialty').value,
      task_type: document.getElementById('wl-task_type').value,
      status: document.getElementById('wl-status').value,
      program: document.getElementById('wl-program').value,
      tier: document.getElementById('wl-tier').value,
      overdue: document.getElementById('wl-overdue').checked ? 'true' : ''
    };
  }
  async function fetchWorklist(reset){
    if (reset) { wlCursor = null; document.getElementById('wl-body').innerHTML = ''; }
    try {
      const params = Object.assign({}, wlFilters(), { limit: 50, cursor: wlCursor || undefined });
      const data = await api('/tasks' + qs(params));
      const tasks = data.tasks || data.items || data.results || [];
      const body = document.getElementById('wl-body');
      tasks.forEach(t => body.appendChild(makeTaskRow(t)));
      wlCursor = data.next_cursor || null;
      document.getElementById('wl-more').hidden = !wlCursor;
    } catch (err) { showError(err); }
  }
  document.querySelectorAll('#view-worklist select, #view-worklist input').forEach(el => {
    el.addEventListener('change', () => fetchWorklist(true));
  });
  document.getElementById('wl-more').addEventListener('click', () => fetchWorklist(false));

  // ---------- patients ----------
  let ptCursor = null;
  function ptFilters(){
    return {
      q: document.getElementById('pt-q').value,
      specialty: document.getElementById('pt-specialty').value,
      task_type: document.getElementById('pt-task_type').value,
      status: document.getElementById('pt-status').value
    };
  }
  function enrollmentsSummary(p){
    const enr = p.enrollments || [];
    return enr.map(e => `${e.program_id || e.program || '?'}:${e.tier || '?'}`).join(', ');
  }
  async function fetchPatients(reset){
    if (reset) { ptCursor = null; document.getElementById('pt-body').innerHTML = ''; document.getElementById('patientDetail').innerHTML = ''; }
    try {
      const params = Object.assign({}, ptFilters(), { limit: 50, cursor: ptCursor || undefined });
      const data = await api('/patients' + qs(params));
      const patients = data.patients || data.items || data.results || [];
      const body = document.getElementById('pt-body');
      patients.forEach(p => {
        const tr = document.createElement('tr');
        tr.style.cursor = 'pointer';
        const name = [p.first_name, p.last_name].filter(Boolean).join(' ');
        const taskCount = (p.tasks || p.visible_tasks || []).length;
        tr.innerHTML = `<td>${escapeHtml(p.patient_id)}</td><td>${escapeHtml(name)}</td><td>${escapeHtml(enrollmentsSummary(p))}</td><td>${taskCount}</td>`;
        tr.addEventListener('click', () => openPatientDetail(p.patient_id));
        body.appendChild(tr);
      });
      ptCursor = data.next_cursor || null;
      document.getElementById('pt-more').hidden = !ptCursor;
    } catch (err) { showError(err); }
  }
  document.querySelectorAll('#view-patients select, #pt-q').forEach(el => {
    el.addEventListener('change', () => fetchPatients(true));
  });
  document.getElementById('pt-more').addEventListener('click', () => fetchPatients(false));

  async function openPatientDetail(patientId){
    const el = document.getElementById('patientDetail');
    el.innerHTML = 'loading…';
    try {
      const p = await api(`/patients/${patientId}`);
      const needs = p.needs || [];
      const tasks = p.tasks || p.visible_tasks || [];
      const needsRows = needs.map(n => `<tr><td>${escapeHtml(n.specialty || n.need)}</td><td>${escapeHtml(n.last_visit)}</td><td>${escapeHtml(n.due_date)}</td><td>${n.upcoming ? 'yes' : 'no'}</td></tr>`).join('');
      el.innerHTML = `
        <h3>${escapeHtml(p.first_name)} ${escapeHtml(p.last_name)} (${escapeHtml(p.patient_id)})</h3>
        <table class="generic"><thead><tr><th>Need</th><th>Last visit</th><th>Due date</th><th>Upcoming</th></tr></thead>
        <tbody>${needsRows || '<tr><td colspan="4" class="hint">none</td></tr>'}</tbody></table>
        <h4>Visible tasks</h4>
        <table><thead><tr>
          <th>Task</th><th>Patient</th><th>Program</th><th>Tier</th><th>Specialty</th><th>Type</th>
          <th>Status</th><th>Due</th><th>Overdue (d)</th><th>Snoozed until</th><th>Actions</th>
        </tr></thead><tbody id="pt-detail-tasks"></tbody></table>`;
      const tbody = document.getElementById('pt-detail-tasks');
      tasks.forEach(t => tbody.appendChild(makeTaskRow(t)));
    } catch (err) {
      el.innerHTML = '';
      showError(err);
    }
  }

  // ---------- admin ----------
  document.getElementById('admin-sync').addEventListener('click', async () => {
    try {
      const r = await api('/admin/sync', { method: 'POST' });
      document.getElementById('admin-result').textContent = 'Sync started/completed: ' + JSON.stringify(r);
      loadSyncRuns();
      loadMeta();
    } catch (err) { showError(err); }
  });
  document.getElementById('admin-evaluate').addEventListener('click', async () => {
    try {
      const r = await api('/admin/evaluate', { method: 'POST', body: { all: true } });
      document.getElementById('admin-result').textContent = 'Evaluate started/completed: ' + JSON.stringify(r);
      loadMeta();
    } catch (err) { showError(err); }
  });
  document.getElementById('admin-refresh-runs').addEventListener('click', loadSyncRuns);

  async function loadSyncRuns(){
    const el = document.getElementById('admin-runs');
    try {
      const data = await api('/admin/sync-runs');
      const runs = data.runs || data.items || data.results || (Array.isArray(data) ? data : []);
      if (!runs.length) { el.innerHTML = '<p class="hint">no runs yet</p>'; return; }
      const cols = Object.keys(runs[0]);
      el.innerHTML = `<table class="generic"><thead><tr>${cols.map(c => `<th>${escapeHtml(c)}</th>`).join('')}</tr></thead>
        <tbody>${runs.map(r => `<tr>${cols.map(c => `<td>${escapeHtml(typeof r[c] === 'object' ? JSON.stringify(r[c]) : r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    } catch (err) { showError(err); }
  }

  // ---------- init ----------
  function refreshAll(){
    loadMeta();
    fetchWorklist(true);
    fetchPatients(true);
    if (currentRole() === 'admin') loadSyncRuns();
  }
  onRoleOrUserChanged();
})();
</script>
</body>
</html>
